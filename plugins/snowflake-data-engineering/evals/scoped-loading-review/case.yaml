schema_version: '1.1'
name: scoped-loading-review
description: A loading-only review reads only the loading reference and still catches the real problems.
tags: [loading, review, token-discipline]
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Check this stage load against Snowflake loading standards. Only the load, nothing else.

    ```sql
    COPY INTO raw.orders
    FROM @raw.land/orders/
    FILE_FORMAT = (TYPE = CSV SKIP_HEADER = 1)
    ON_ERROR = CONTINUE
    FORCE = TRUE;
    ```

    raw.orders has typed columns (NUMBER, DATE, VARCHAR). The job reruns this every day over the same stage folder.
graders:
- {name: skill-fired, type: tool_used, tool: Skill, input_match: '"skill"\s*:\s*"(?:[\w-]+:)?snowflake-data-engineering"'}
- {name: read-loading-reference, type: tool_used, tool: Read, input_match: references\W+loading\.md, min: 1, arm: with-only}
- {name: no-unrelated-references, type: tool_used, tool: Read, input_match: references\W+(security-governance|ai-and-apps|iac-cicd|performance-cost|review-audit|python-clients)\.md, min: 0, max: 0, arm: with-only}
- {name: duplicates, type: regex, pattern: duplicat, flags: i}
- name: criteria
  type: llm
  criteria: |
    PASS if the review flags at least three of these, including the first two: FORCE = TRUE on a daily rerun reloads the same files and creates duplicates (delete the period's rows or MERGE first); ON_ERROR = CONTINUE silently drops bad rows without a reject process or alert; no explicit column list or METADATA$FILENAME source tracking; typed raw columns instead of STRING/VARIANT; no row-count reconciliation or load manifest.
    FAIL if it misses the FORCE duplicate problem or the ON_ERROR = CONTINUE problem, or if it drifts into unrelated areas (security, cost, Terraform) instead of reviewing the load.
- {name: format-sections, type: regex, pattern: '^#+\s*Checklist[\s\S]*^#+\s*Not checked', flags: im}
- {name: format-checklist-table, type: regex, pattern: \|\s*#\s*\|\s*Standard\s*\|\s*Result\s*\|\s*Evidence\s*\|\s*Fix\s*\|, flags: i}
- {name: format-summary-counts, type: regex, pattern: '\d+\s+pass,\s*\d+\s+partial,\s*\d+\s+fail', flags: i}
