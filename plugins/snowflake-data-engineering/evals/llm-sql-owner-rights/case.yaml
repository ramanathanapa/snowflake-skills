schema_version: '1.1'
name: llm-sql-owner-rights
description: Generated SQL must not run with owner write privileges.
tags: [security, ai]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    My Streamlit in Snowflake app sends user questions to Cortex Analyst and runs whatever SQL it returns with session.sql(). The app is owned by our data engineering role, which owns every schema in the database. Is that a problem? If so, what should I change?
graders:
- name: criteria
  type: llm
  criteria: |
    PASS if the answer says yes, it is a problem, because the app runs with its owner's privileges so generated SQL could modify or drop objects, AND recommends both a least-privilege read-only owner role limited to the serving views and a guard that only allows a single SELECT or WITH statement (optionally with a row limit).
    FAIL if it says the setup is fine, or offers only one of the two controls.
- {name: read-only, type: regex, pattern: 'read.?only', flags: i}
- {name: skill-fired, type: tool_used, tool: Skill, input_match: '"skill"\s*:\s*"(?:[\w-]+:)?snowflake-data-engineering"'}
