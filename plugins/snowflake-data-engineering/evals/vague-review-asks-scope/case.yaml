schema_version: '1.1'
name: vague-review-asks-scope
description: A vague review request makes Claude ask which area to check instead of reading many references.
tags: [review, token-discipline]
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Can you review my Snowflake project against the standards?
graders:
- {name: skill-fired, type: tool_used, tool: Skill, input_match: '"skill"\s*:\s*"(?:[\w-]+:)?snowflake-data-engineering"'}
- {name: at-most-one-reference, type: tool_used, tool: Read, input_match: references\W+(foundations|loading|modeling-sql|pipelines|performance-cost|security-governance|iac-cicd|testing-quality|python-clients|ai-and-apps|pitfalls|review-audit)\.md, min: 0, max: 1, arm: with-only}
- {name: offers-areas, type: regex, pattern: 'loading[\s\S]*security|security[\s\S]*loading', flags: i}
- name: criteria
  type: llm
  criteria: |
    PASS if the reply asks the user which area to review (for example loading, modeling, pipelines, cost, security, infrastructure/CI, quality, Python, AI/apps), or asks for the files or scope, before doing any review. Suggesting a likely starting area or offering a full audit as an explicit option is fine.
    FAIL if the reply starts reviewing or lists generic findings across many areas without asking, or produces a full audit unprompted.
