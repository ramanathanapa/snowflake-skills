schema_version: '1.1'
name: copy-rerun-zero-rows
description: COPY INTO skips already-loaded files; the fix must avoid duplicates.
tags: [loading]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    I fixed a bug in my Snowflake target table and reran the same COPY INTO for the same staged files, but it reported 0 rows loaded. Why did that happen, and how do I reload safely without creating duplicate rows?
graders:
- name: criteria
  type: llm
  criteria: |
    PASS if the answer explains that Snowflake keeps load metadata and skips files it has already loaded, AND gives a duplicate-safe reload: remove or replace the affected rows (delete, truncate or MERGE) before reloading with FORCE = TRUE or an equivalent.
    FAIL if it only says to add FORCE = TRUE without addressing duplicates, or blames file corruption or permissions.
- {name: force, type: regex, pattern: FORCE\s*=\s*TRUE, flags: i}
- {name: skill-fired, type: tool_used, tool: Skill, input_match: '"skill"\s*:\s*"(?:[\w-]+:)?snowflake-data-engineering"'}
