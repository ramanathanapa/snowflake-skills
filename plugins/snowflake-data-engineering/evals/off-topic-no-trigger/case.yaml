schema_version: '1.1'
name: off-topic-no-trigger
description: Negative case. The skill must not trigger on unrelated programming requests.
tags: [triggering]
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Write a Python function that checks whether a string is a palindrome, ignoring case and punctuation.
graders:
- {name: answer, type: regex, pattern: def \w+\(}
- {name: no-skill, type: tool_used, tool: Skill, input_match: '"skill"\s*:\s*"(?:[\w-]+:)?snowflake-data-engineering"', min: 0, max: 0, arm: both}
