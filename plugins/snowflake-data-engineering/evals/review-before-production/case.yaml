schema_version: '1.1'
name: review-before-production
description: A short review must catch admin role, password auth, SQL injection and state/CI gaps.
tags: [audit, security, iac]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Please review this Snowflake setup for security and operational problems before we go to production. Rank the findings.

    Terraform provider:
    ```hcl
    provider "snowflake" {
      organization_name = "myorg"
      account_name      = "prod"
      user              = "jane"
      password          = var.sf_password
      role              = "ACCOUNTADMIN"
    }
    ```

    Loader snippet:
    ```python
    cur.execute(f"SELECT * FROM sales.analytics.orders WHERE region = '{region}'")
    ```

    Terraform state is a local file on Jane's laptop, and there is no CI pipeline.
graders:
- {name: accountadmin, type: regex, pattern: ACCOUNTADMIN}
- name: criteria
  type: llm
  criteria: |
    PASS if the answer ranks its findings and covers at least four of: Terraform running as ACCOUNTADMIN (use a dedicated least-privilege role); password authentication for automation (use a service user with key-pair or OAuth); SQL injection from the f-string (use bind parameters); local Terraform state (use a remote backend with locking); no CI (plan on pull request, apply after review).
    FAIL if it misses either the ACCOUNTADMIN issue or the SQL injection, or if it does not rank the findings.
- {name: skill-fired, type: tool_used, tool: Skill, input_match: '"skill"\s*:\s*"(?:[\w-]+:)?snowflake-data-engineering"'}
- {name: format-unverified-section, type: regex, pattern: not checked|could not verify, flags: i}
