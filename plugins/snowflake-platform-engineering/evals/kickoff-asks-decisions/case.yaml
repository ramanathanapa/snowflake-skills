schema_version: '1.1'
name: kickoff-asks-decisions
description: Kickoff asks the organization-only decisions with defaults and writes nothing yet.
tags: [kickoff, blueprint]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    We are starting to use Snowflake across our company. Help me set up the platform properly from the beginning.
graders:
- {name: skill-fired, type: tool_used, tool: Skill, input_match: '"skill"\s*:\s*"(?:[\w-]+:)?snowflake-platform-engineering"'}
- {name: mentions-blueprint, type: regex, pattern: blueprint, flags: i}
- name: criteria
  type: llm
  criteria: |
    PASS if the reply asks the user for the organization-level decisions (at least five of: compliance or data residency, identity provider, account topology, environments, edition or region, budget or chargeback, recovery objectives, approvers), offers a recommended default for each, and explains that the answers will be recorded in a blueprint before any building starts.
    FAIL if it starts creating accounts, roles or policies, or produces a full design without asking for the organization's decisions.
