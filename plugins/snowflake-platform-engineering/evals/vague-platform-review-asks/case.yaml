schema_version: '1.1'
name: vague-platform-review-asks
description: A vague platform review leads to a scope question or the scorecard, not reading many phases.
tags: [review, token-discipline]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Review our Snowflake platform.
graders:
- {name: skill-fired, type: tool_used, tool: Skill, input_match: '"skill"\s*:\s*"(?:[\w-]+:)?snowflake-platform-engineering"'}
- {name: no-phase-files, type: tool_used, tool: Read, input_match: 'references\W+phase-(?!00)\d\d', min: 0, max: 1, arm: with-only}
- name: criteria
  type: llm
  criteria: |
    PASS if the reply asks which area or phase to review (for example identity, security baseline, access, cost, observability, governance, resilience) or offers the readiness scorecard from the checks scripts, before reviewing anything.
    FAIL if it launches into findings across many areas without asking, or claims results about the account without evidence.
